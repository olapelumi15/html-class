<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
    <style>
  .request-button{
    background-color: black;
    color:white;
    border:none;
    height:31px;
    width:90px;
    font-size:x-small;
    cursor:pointer;
  }
  .request-button:hover{
    opacity: 0.8;
  }
  .request-button:active{
    opacity: 0.5;
  }

  .add-to-cart-button{
    background-color:rgb(255, 216, 20);
    color:black;
    border:none;
    height:30px;
    width:160px;
    border-radius:30px;
    margin-left:16px;
    cursor:pointer;
  }
  .add-to-cart-button:hover{
    background-color:rgb(246,200, 38);
  }

  .sign-up-button{
    background-color:rgb(46, 164, 79);
    color:white;
    border:none;
    height:36px;
    width:100px;
    font-weight:bolder;
    font-size:14px;
    border-radius:6px;
    border-width:bold;
    margin-left:8px;
    cursor:pointer;
  }
.sign-up-button:hover{
  box-shadow:2px 3px 10px rgba(0, 0, 0, 0.10)
}

  .get-started{
    background-color:rgb(129, 82, 179);
    color:white;
    border:none;
    height:36px;
    width:110px;
    font-weight:bolder;
    font-size:13px;
    border-radius:6px;
    margin-left:8px;
    cursor: pointer;
    transition: backsground-color 0.15s;
  }
.get-started:hover{
  background-color:rgba(112, 50, 160, 0.995);
}

  .download-button{
    background-color:white;
    color:rgb(108, 117, 125);
    height:36px;
    width:110px;
    font-weight:bolder;
    font-size:14px;
    border-radius:3px;
    border-style:solid;
    border-width:1px;
    margin-right:8px;
    cursor:pointer; 
    transition:background-color o.15s,
    color 0.15s;  
  }
.download-button:hover{
  background-color:rgb(108, 117, 125);
  color:white;
}

  .linkedin-button{
    background-color: rgb(10, 102, 194);
    color:white;
    height:38px;
    width:240px;
    font-weight:bold;
    font-size:15px;
    border-radius:36px;
    border-style:solid;
    border-width:0px;
    margin-left:8px;
    cursor:pointer;
    transition:background-color 0.15s;
  }

  .linkedin-button:hover{
    background-color:rgba(20, 40, 110, 0.948)
  }
  .save-button{
  background-color:white;
  color:rgb(10, 102, 194);
  height:36px;
  width:80px;
  font-weight:bold;
  font-size:15px;
  border-radius:36px;
  border-style:solid;
  border-width:1px;
  margin-left:8px;
  cursor:pointer;
  border-color:rgb(10, 102, 194) 
  }
  .save-button:hover{
    background-color:rgba(120, 200, 200, 0.231) 
  }
</style>
</head>
<body>

<button class="request-button">
  Request now
</button>
<button class="add-to-cart-button">

</button>
<button class="sign-up-button">
  Sign up</button>
  <button class="get-started">
    Get started
  </button>
  <button class="download-button">

  </button>
  <button class= "linkedin-button">

  </button>
  <button class="save-button">
    Save
  </button>
